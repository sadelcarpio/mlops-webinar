[project]
name = "mlops-webinar"
version = "0.1.0"
description = "MLOps en la práctica: pronóstico de la demanda eléctrica del SEIN (Perú)"
requires-python = ">=3.12"
# Lo que necesita el pipeline para correr
dependencies = [
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "xgboost-cpu>=3.4.1",
]

[dependency-groups]
# Tests y lint (se instalan en la imagen de tests)
test = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]
# Solo para experimentar en tu máquina
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    { include-group = "test" },
]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
