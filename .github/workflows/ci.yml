name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen de tests
        run: docker build --target tests -t demanda-tests .

      - name: Lint y tests dentro del contenedor
        run: docker run --rm demanda-tests
